version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gymora-postgres
    environment:
      POSTGRES_DB: gymora_db
      POSTGRES_USER: gymora_user
      POSTGRES_PASSWORD: gymora_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymora_user -d gymora_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymora-network

  redis:
    image: redis:7-alpine
    container_name: gymora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymora-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymora-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://[2406:da1a:82a:9d02:a7c2:475f:a3ab:6482]:6543/postgres?sslmode=require
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Surayu@6299
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: gymora-super-secret-key-that-should-be-at-least-256-bits-long-for-security
    ports:
      - "8080:8080"
    extra_hosts:
      - "db.xvlvpqmrtxvxxzkpxhqs.supabase.co:2406:da1a:82a:9d02:a7c2:475f:a3ab:6482"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gymora-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  postgres_data:
  redis_data:

networks:
  gymora-network:
    driver: bridge
