name: gymora_app
description: Gymora - Gym Management and Tracking Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.3.0

  # State Management
  provider: ^6.1.1

  # Networking
  dio: ^5.4.1
  retrofit: ^4.1.0

  # Charts
  fl_chart: ^0.66.2

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.27.1
  firebase_messaging: ^14.7.20
  firebase_storage: ^11.6.10

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.4
  connectivity_plus: ^6.0.2
  table_calendar: ^3.0.9
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/


