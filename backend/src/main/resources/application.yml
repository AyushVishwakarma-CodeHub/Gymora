spring:
  application:
    name: gymora-backend

  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://db.xvlvpqmrtxvxxzkpxhqs.supabase.co:6543/postgres?sslmode=require
    username: postgres
    password: Surayu@6299

  jpa:
    hibernate:
      ddl-auto: update
  cache:
    type: none
  session:
    store-type: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  jwt:
    secret: gymora-super-secret-key-that-should-be-at-least-256-bits-long-for-security
    access-token-expiration: 900000    # 15 minutes
    refresh-token-expiration: 604800000 # 7 days
  cors:
    allowed-origins: "*"
