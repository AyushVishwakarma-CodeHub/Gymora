spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gymora_db
    username: gymora_user
    password: gymora_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000

logging:
  level:
    com.gymora: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
